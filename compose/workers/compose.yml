x-frappe-worker: &frappe-worker
  image: ${FRAPPE_SUITE_IMAGE:?Same pinned suite digest as application}
  restart: unless-stopped
  environment:
    NLTK_DATA: /home/frappe/frappe-bench/sites/.nltk_data
  # Frappe's site directory MUST be a real mounted NFS filesystem.
  # Docker create_host_path:false alone does not establish that a remote mount is active.
  # The original image entrypoint still runs afterwards to link built assets.
  entrypoint:
    - /bin/bash
    - -ec
    - |
      case "$(stat -f -c %T /home/frappe/frappe-bench/sites)" in
        nfs|nfs4) ;;
        *) echo "FATAL: Frappe sites must be on NFS; refusing to start" >&2; exit 70 ;;
      esac
      exec /usr/local/bin/entrypoint.sh "$@"
    - verify-sites-nfs
  volumes:
    - type: bind
      source: /mnt/frappe-sites/cetech-production-sites
      target: /home/frappe/frappe-bench/sites
      bind:
        create_host_path: false

services:
  redis-cache:
    # Redis 8 includes Search commands (FT.CREATE) needed by Helpdesk.
    # Keep redis-queue on its existing Redis 7.4 image and persistent volume.
    image: ${REDIS_CACHE_IMAGE:?Set Redis 8 image with built-in Search}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/run/redis/cache.acl"]
    ports:
      - "${WORKER_PRIVATE_IP:?Worker private address}:6379:6379"
    volumes:
      - type: bind
        source: ${REDIS_ACL_DIR:?Private Redis ACL path}/cache.acl
        target: /run/redis/cache.acl
        read_only: true
        bind:
          create_host_path: false

  redis-queue:
    image: ${REDIS_IMAGE:?Set Redis image version}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--aclfile", "/run/redis/queue.acl"]
    ports:
      - "${WORKER_PRIVATE_IP:?Worker private address}:6380:6379"
    volumes:
      - redis_queue_data:/data
      - type: bind
        source: ${REDIS_ACL_DIR:?Private Redis ACL path}/queue.acl
        target: /run/redis/queue.acl
        read_only: true
        bind:
          create_host_path: false

  queue-short:
    <<: *frappe-worker
    profiles: ["site-ready"]
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on: [redis-queue]

  queue-long:
    <<: *frappe-worker
    profiles: ["site-ready"]
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on: [redis-queue]

  scheduler:
    <<: *frappe-worker
    profiles: ["site-ready"]
    command: ["bench", "schedule"]
    depends_on: [redis-queue]

volumes:
  redis_queue_data:
