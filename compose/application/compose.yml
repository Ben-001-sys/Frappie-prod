x-frappe-common: &frappe-common
  image: ${FRAPPE_SUITE_IMAGE:?Set a pinned GHCR suite digest}
  restart: unless-stopped
  # Frappe's site directory MUST be a real mounted NFS filesystem.
  # Docker create_host_path:false alone does not establish that a remote mount is active.
  # The original image entrypoint still runs afterwards to link built assets.
  entrypoint:
    - /bin/bash
    - -ec
    - |
      case "$(stat -f -c %T /home/frappe/frappe-bench/sites)" in
        nfs|nfs4) ;;
        *) echo "FATAL: Frappe sites must be on NFS; refusing to start" >&2; exit 70 ;;
      esac
      exec /usr/local/bin/entrypoint.sh "$@"
    - verify-sites-nfs
  volumes:
    - type: bind
      source: /mnt/frappe-sites/frappe-site-data
      target: /home/frappe/frappe-bench/sites
      bind:
        create_host_path: false

services:
  configurator:
    <<: *frappe-common
    restart: "no"
    # Pass the entire configuration script as one Bash argument.
    # Command substitution avoids Compose interpolation of shell variable names.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        cd /home/frappe/frappe-bench
        case "$(stat -f -c %T sites)" in
          nfs|nfs4) ;;
          *) echo "FATAL: sites must be on NFS; refusing to configure" >&2; exit 70 ;;
        esac
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host "$(printenv DB_HOST)"
        bench set-config -gp db_port "$(printenv DB_PORT)"
        bench set-config -g redis_cache "$(printenv REDIS_CACHE_URL)"
        bench set-config -g redis_queue "$(printenv REDIS_QUEUE_URL)"
        bench set-config -g redis_socketio "$(printenv REDIS_QUEUE_URL)"
        bench set-config -gp socketio_port 9000
    environment:
      DB_HOST: ${DB_HOST:?Private MariaDB host}
      DB_PORT: "3306"
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:?Authenticated Redis cache URL}
      REDIS_QUEUE_URL: ${REDIS_QUEUE_URL:?Authenticated Redis queue URL}

  backend:
    <<: *frappe-common
    command: ["start.sh"]
    depends_on:
      configurator:
        condition: service_completed_successfully
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}

  websocket:
    <<: *frappe-common
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *frappe-common
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME:?Set operational hostname}
      CLIENT_MAX_BODY_SIZE: 50m
    expose: ["8080"]
    depends_on:
      - backend
      - websocket
