name: Smoke install Frappe images
on:
  workflow_run:
    workflows: ["Build Frappe images to GHCR"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Full source commit SHA of a completed, published image build"
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: smoke-install-${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Bench site install (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [suite, insights]
    env:
      FLAVOR: ${{ matrix.flavor }}
      TEST_IMAGE: ghcr.io/ben-001-sys/frappie-${{ matrix.flavor }}:sha-${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.event.workflow_run.head_sha }}
      TEST_DB_PASSWORD: smoke_test_only_root_pw_3B2c8a
      TEST_ADMIN_PASSWORD: smoke_test_only_admin_pw_7G9d2h
      SMOKE_SITE: smoke.local
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run isolated Bench site creation and app install
        run: bash scripts/smoke-install.sh
      - name: Record published image digest
        if: success()
        run: |
          docker image inspect "$TEST_IMAGE" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Collect MariaDB logs after failure
        if: failure()
        run: docker logs --tail 100 "smoke-db-${{ matrix.flavor }}" || true
      - name: Cleanup temporary test environment
        if: always()
        run: |
          docker rm -f "smoke-db-${{ matrix.flavor }}" "smoke-redis-${{ matrix.flavor }}" 2>/dev/null || true
          docker network rm "frappe-smoke-${{ matrix.flavor }}" 2>/dev/null || true
          docker volume rm "frappe-sites-smoke-${{ matrix.flavor }}" 2>/dev/null || true
