name: Build and smoke-test Frappe Suite v16 candidate (NO DEPLOY)

on:
  push:
    branches: [upgrade/v16-staging-20261103]
    paths:
      - 'apps/suite-v16-candidate.json'
      - 'scripts/smoke-install-v16.sh'
      - 'images/frappe-suite-v16/Containerfile'
      - '.github/workflows/build-v16-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-v16-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build isolated v16 candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Checkout pinned upstream Frappe Docker build context
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: fbf76edcf5791b1d9743955b85caf0a19974d5a6
          path: upstream/frappe_docker
          persist-credentials: false

      - name: Validate candidate files
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool apps/suite-v16-candidate.json >/dev/null
          bash -n scripts/smoke-install-v16.sh
          test -f images/frappe-suite-v16/Containerfile
          python - <<'PY'
          import json
          apps = json.load(open("apps/suite-v16-candidate.json", encoding="utf-8"))
          assert len(apps) == 9, f"Expected nine apps, got {len(apps)}"
          names = {app["url"].rsplit("/", 1)[-1] for app in apps}
          expected = {"erpnext", "hrms", "crm", "telephony", "helpdesk",
                      "payments", "lms", "raven", "offsite_backups"}
          assert names == expected, (names, expected)
          print("Candidate app manifest validated")
          PY

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish isolated v16 candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream/frappe_docker
          file: ./images/frappe-suite-v16/Containerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ben-001-sys/frappie-suite-v16-candidate:sha-${{ github.sha }}
          secret-files: |
            apps_json=./apps/suite-v16-candidate.json
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_REF=v16.54.0
            FRAPPE_PATH=https://github.com/frappe/frappe
            CACHE_BUST=${{ github.sha }}
          cache-from: type=gha,scope=frappe-v16-candidate
          cache-to: type=gha,mode=max,scope=frappe-v16-candidate
          provenance: mode=max
          sbom: true

      - name: Record immutable candidate image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo '### Frappe Suite v16 candidate — build only' >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/ben-001-sys/frappie-suite-v16-candidate@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Target Frappe: v16.54.0; database for next smoke test: MariaDB 11.8' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT approved for Dokploy deployment; v15 remains unchanged.' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Fresh-site v16 multi-app smoke test (disposable data)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      TEST_IMAGE: ghcr.io/ben-001-sys/frappie-suite-v16-candidate@${{ needs.build.outputs.digest }}
      SMOKE_SITE: smoke-v16.local
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate disposable test credentials
        shell: bash
        run: |
          set -euo pipefail
          db_pass="$(openssl rand -hex 24)"
          admin_pass="$(openssl rand -hex 24)"
          echo "::add-mask::$db_pass"
          echo "::add-mask::$admin_pass"
          echo "TEST_DB_PASSWORD=$db_pass" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_PASSWORD=$admin_pass" >> "$GITHUB_ENV"

      - name: Smoke install all nine apps and run v16 migrate
        shell: bash
        run: bash scripts/smoke-install-v16.sh

      - name: Record successful smoke-tested digest
        if: success()
        run: |
          echo '### Disposable v16 site smoke test passed' >> "$GITHUB_STEP_SUMMARY"
          echo "Validated image: $TEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'All nine candidate apps installed and migrated against MariaDB 11.8.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not validate v15-to-v16 migration of the actual staging database.' >> "$GITHUB_STEP_SUMMARY"
